services:
  cadvisor:
    image: s1hub.nebula.prod/kbt-db/s1-db/cadvisor:v0.49.1
    container_name: cadvisor-container
    network_mode: host
    pid: host
    privileged: true
    restart: always
    init: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker/:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
