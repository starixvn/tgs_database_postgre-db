services:
 postgres:
    image: s1hub.nebula.prod/kbt-db/s1-db/postgresql-uat:v1.0
    container_name: postgresql-uat-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VmWr4gf6MXRN
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./configs/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./configs/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    ports:
      - '5433:5432'
volumes:
  postgres-data:
    driver: local