services:
  postgres:
    image: s1hub.nebula.prod/kbt-db/s1-db/uat-postgres:v1.1
    container_name: uat-postgres-container
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/uat-postgres/s1db01/data:/var/lib/postgresql/data:rw
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:rw
      - ./configs/pg_hba.conf:/etc/postgresql/pg_hba.conf:rw
    user: "379:379"  # Run as the host user with UID 379
    command: ["postgres",
              "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
